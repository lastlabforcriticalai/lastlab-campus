name: Test campus backend
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/worker.mjs
          node --check src/student-access.mjs
          node --check public/account.js
          node --check public/course.js
      - name: Run tests
        run: node --test tests/*.test.mjs
